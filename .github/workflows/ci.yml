name: Verify source installation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TYPESAFE_API_KEY: ""
      OPENROUTER_API_KEY: ""
      JEV_SCOUT_LLM_API_KEY: ""
      JEV_SCOUT_LLM_BASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install pinned Python dependencies and source project
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install frozen frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Run backend, frontend and isolated wheel checks
        run: python scripts/verify.py --require-frontend --package
      - name: Reproduce the offline benchmark
        run: python -m jev_scout.evaluation --output artifacts/evaluation/ci-report.json
      - name: Upload measured offline report
        uses: actions/upload-artifact@v4
        with:
          name: offline-benchmark-${{ matrix.os }}
          path: artifacts/evaluation/ci-report.json
          if-no-files-found: error

  docker:
    name: Linux loopback container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag jev-scout:ci .
      - name: Start localhost-only image using Linux host networking
        run: docker run --detach --name jev-scout-ci --network host jev-scout:ci
      - name: Check server health and built frontend
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; assert json.load(open("/tmp/health.json"))["status"] == "ok"'
          curl --fail --silent http://127.0.0.1:8765/ > /tmp/index.html
          python -c 'from pathlib import Path; assert "<html" in Path("/tmp/index.html").read_text().lower()'
      - name: Container logs
        if: always()
        run: docker logs jev-scout-ci
      - name: Stop container
        if: always()
        run: docker rm --force jev-scout-ci
